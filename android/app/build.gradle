plugins { id 'com.android.application' }

def signingFile = System.getenv('ANDROID_BROWSER_SIGNING_PROPERTIES')
def releaseKeys = new Properties()
if (signingFile) { file(signingFile).withInputStream { releaseKeys.load(it) } }

android {
    namespace 'com.culpen.browser'
    compileSdk 36
    defaultConfig {
        applicationId 'com.culpen.browser'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testProguardFiles 'test-proguard-rules.pro'
    }
    signingConfigs {
        if (signingFile) {
            release {
                storeFile file(releaseKeys.getProperty('storeFile'))
                storePassword releaseKeys.getProperty('storePassword')
                keyAlias releaseKeys.getProperty('keyAlias')
                keyPassword releaseKeys.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            if (signingFile) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testBuildType project.hasProperty('testRelease') ? 'release' : 'debug'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
